substitutions:
  _SERVICE_NAME: users-api
  _REGION: us-central1
  _AR_REPO: users-api
  _CLOUDSQL_INSTANCE: stefanini-495702:us-central1:users-api-db
  _RUNTIME_SA: users-api-runtime@stefanini-495702.iam.gserviceaccount.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir uv
        uv sync --frozen 2>/dev/null || uv sync
        .venv/bin/pytest -q tests/unit

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}

  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=ENVIRONMENT=production
      - --set-secrets=DATABASE_URL=database-url:latest,SECRET_KEY=secret-key:latest
      - --min-instances=0
      - --max-instances=2
      - --concurrency=80
      - --cpu=1
      - --memory=512Mi
      - --timeout=60s
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
